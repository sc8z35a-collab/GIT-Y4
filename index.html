<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>NARROW-50</title>
  <script type="module" crossorigin src="./assets/dev-Dy5BH6o8.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-vendor-fd_qxMI7.js">
  <link rel="stylesheet" crossorigin href="./assets/dev-wCyT0zsW.css">
</head>
<body>
  <div id="stage" class="stage">
    <div id="canvas-3d" class="canvas-3d"></div>

    <div id="webgl-error" class="webgl-error hidden" role="alert">
      <h2>WebGL Error</h2>
      <p id="webgl-error-msg"></p>
    </div>

    <!-- Portrait-to-Landscape Fullscreen Guard (Coarse Touch Portrait Only) -->
    <div id="rotate-guard" class="rotate-guard" aria-hidden="true">
      <svg class="rotate-icon" viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="10" y="18" width="44" height="28" rx="5" />
        <circle cx="48" cy="32" r="2" fill="currentColor" />
      </svg>
      <button id="btn-enter-landscape" class="rotate-btn" type="button">横画面</button>
    </div>

    <!-- POCO F7 Landscape Fullscreen Minimal Dual-Thumb Layer (2.3× Ergonomic Control Stick) -->
    <div id="touch-layer" class="touch-layer" aria-hidden="true">
      <div id="joy-zone" class="joy-zone">
        <div id="joy-base" class="joy-base joy-base-idle">
          <div class="joy-sprint-ring"></div>
          <div id="joy-knob" class="joy-knob"></div>
        </div>
      </div>
      <div id="look-zone" class="look-zone"></div>
    </div>

    <!-- Hairline Center Reticle -->
    <div id="reticle" class="reticle" aria-hidden="true">
      <div class="reticle-dot"></div>
      <div class="reticle-ring"></div>
    </div>

    <!-- Single Minimal Action Chip (Physical 3D Elevator Buttons / Driver Seat / Lamps only) -->
    <button id="interact-prompt" class="interact-prompt hidden" type="button">
      <span id="interact-label"></span>
    </button>

    <!-- Ultra-Minimal Top-Right HUD: ONLY 地図 & 設定 -->
    <header id="hud-top" class="hud-top">
      <button id="btn-map" class="hud-btn" type="button">地図</button>
      <button id="btn-settings" class="hud-btn" type="button">設定</button>
    </header>

    <!-- Optional Minimal Numeric Telemetry (Toggled from 設定) -->
    <aside id="perf-panel" class="perf-panel hidden" aria-label="計測">
      <div id="perf-grid" class="perf-grid"></div>
    </aside>

    <!-- Consolidated Minimalist Settings Sheet -->
    <aside id="settings-sheet" class="settings-sheet hidden" role="dialog" aria-label="設定">
      <div class="settings-head">
        <span>設定</span>
        <button id="btn-close-settings" class="icon-close-btn" type="button" aria-label="閉じる">✕</button>
      </div>

      <div class="settings-body">
        <div class="setting-row setting-row-col">
          <div class="setting-label-row">
            <span>カメラ感度</span>
            <strong id="sens-val" class="mono-val">1.0×</strong>
          </div>
          <input id="input-sens" class="setting-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
        </div>

        <label class="setting-row setting-toggle">
          <div class="setting-title-col">
            <span>SM1.1S</span>
            <small>SURFACE MODE 1.1 SUPER</small>
          </div>
          <input id="toggle-sm11s" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>嵐</span>
          <input id="toggle-storm" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>ライト</span>
          <input id="toggle-light" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>音声</span>
          <input id="toggle-audio" type="checkbox" checked />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>計測</span>
          <input id="toggle-perf" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <div class="setting-ai-box">
          <div class="setting-label-row">
            <div class="setting-title-col">
              <span>APEX-OMNIDRIVE v6</span>
              <small id="apex-ai-meta">内蔵 APEX-v6 BASE</small>
            </div>
            <span id="apex-ai-badge" class="ai-badge">BASE</span>
          </div>
          <div class="setting-ai-btns">
            <a id="btn-colab-l4" class="setting-action-btn setting-action-colab" href="https://colab.research.google.com/github/sc8z35a-collab/GIT-Y4/blob/main/colab/APEX_DRIVE_L4_GPU_Training.ipynb" target="_blank" rel="noopener noreferrer">Colab TITAN</a>
            <button id="btn-ai-import" class="setting-action-btn setting-action-accent" type="button">重み読込</button>
            <button id="btn-ai-reset" class="setting-action-btn hidden" type="button">標準</button>
            <input id="input-ai-weights" type="file" accept=".json,application/json" class="hidden" />
          </div>
        </div>

        <div class="settings-actions">
          <button id="btn-fullscreen" class="setting-action-btn" type="button">全画面</button>
          <button id="btn-drive-exit-settings" class="setting-action-btn setting-action-danger hidden" type="button">降車</button>
          <button id="btn-install" class="setting-action-btn setting-action-accent hidden" type="button">PWA</button>
        </div>
      </div>
    </aside>

    <!-- Minimal Auto-Fading Status Notification Pill (K-11 Summon / Refuel / Silo Status) -->
    <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>

    <!-- Minimal Driving & K-11 Flight Control Bar -->
    <div id="drive-hud" class="drive-hud-bar hidden" aria-label="運転・操縦操作">
      <div id="k11-flight-controls" class="k11-flight-controls hidden">
        <div class="drive-tele-pill" aria-label="高度・燃料">
          <span class="tele-item">ALT <strong id="k11-alt-val">0</strong>m</span>
          <span class="tele-sep">|</span>
          <span class="tele-item">FUEL <strong id="k11-fuel-val">100.0</strong>L</span>
          <span class="tele-sep">|</span>
          <span class="tele-item">WIND <strong id="k11-wind-val">0</strong></span>
        </div>
        <button id="btn-k11-up" class="drive-action-btn drive-action-k11" type="button">上昇</button>
        <button id="btn-k11-down" class="drive-action-btn drive-action-k11" type="button">降下</button>
        <button id="btn-k11-silo" class="drive-action-btn drive-action-amber hidden" type="button">格納昇降</button>
        <button id="btn-k11-refuel" class="drive-action-btn drive-action-emerald hidden" type="button">給油</button>
        <button id="btn-k11-call-rv" class="drive-action-btn" type="button">RV呼出</button>
        <button id="btn-k11-call-armor" class="drive-action-btn" type="button">装甲呼出</button>
      </div>
      <button id="btn-drive-auto" class="drive-action-btn" type="button">自動運転</button>
      <button id="btn-drive-cam" class="drive-action-btn" type="button">視点</button>
      <button id="btn-drive-exit" class="drive-action-btn drive-action-exit" type="button">降車</button>
      <div class="drive-speed-pill" aria-label="速度">
        <strong id="drive-speed-val">0</strong>
        <span>km/h</span>
      </div>
    </div>

    <!-- Subtle On-Foot Autopilot Indicator & Stop Chip (Shown Only While Autopilot Drives Without Seated Driver) -->
    <button id="autopilot-stop-chip" class="autopilot-stop-chip hidden" type="button">
      <span id="autopilot-stop-label">自動走行中・停止</span>
    </button>

    <!-- Single Ultra-Minimal Crouch Icon (On-Foot Touch Only, Hidden While Driving) -->
    <div id="mobile-actions" class="mobile-actions">
      <button id="mob-crouch" class="mob-crouch-btn" type="button" aria-label="しゃがむ">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    </div>

    <!-- Edge-to-Edge Fullscreen Pinnacle 2D-Only Cartographic Map Modal -->
    <section id="map-modal" class="map-modal mode-2d hidden" role="dialog" aria-modal="true" aria-label="地図">
      <div id="terreno-2d-panel" class="terreno-2d-panel"></div>
      <div class="map-float-tr">
        <button id="btn-close-map" class="map-icon-btn map-close-icon" type="button" aria-label="閉じる">✕</button>
      </div>
    </section>
  </div>

</body>
</html>
