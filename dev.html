<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>NARROW-50</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div id="canvas-3d" class="canvas-3d"></div>

    <div id="webgl-error" class="webgl-error hidden" role="alert">
      <h2>WebGL Error</h2>
      <p id="webgl-error-msg"></p>
    </div>

    <!-- Portrait-to-Landscape Fullscreen Guard (Coarse Touch Portrait Only) -->
    <div id="rotate-guard" class="rotate-guard" aria-hidden="true">
      <svg class="rotate-icon" viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="10" y="18" width="44" height="28" rx="5" />
        <circle cx="48" cy="32" r="2" fill="currentColor" />
      </svg>
      <button id="btn-enter-landscape" class="rotate-btn" type="button">横画面</button>
    </div>

    <!-- POCO F7 Landscape Fullscreen Minimal Dual-Thumb Layer (2.3× Ergonomic Control Stick) -->
    <div id="touch-layer" class="touch-layer" aria-hidden="true">
      <div id="joy-zone" class="joy-zone">
        <div id="joy-base" class="joy-base joy-base-idle">
          <div class="joy-sprint-ring"></div>
          <div id="joy-knob" class="joy-knob"></div>
        </div>
      </div>
      <div id="look-zone" class="look-zone"></div>
    </div>

    <!-- Hairline Center Reticle -->
    <div id="reticle" class="reticle" aria-hidden="true">
      <div class="reticle-dot"></div>
      <div class="reticle-ring"></div>
    </div>

    <!-- Single Minimal Action Chip (Physical 3D Elevator Buttons / Driver Seat / Lamps only) -->
    <button id="interact-prompt" class="interact-prompt hidden" type="button">
      <span id="interact-label"></span>
    </button>

    <!-- Ultra-Minimal Top-Right HUD: ONLY 地図 & 設定 -->
    <header id="hud-top" class="hud-top">
      <button id="btn-map" class="hud-btn" type="button">地図</button>
      <button id="btn-settings" class="hud-btn" type="button">設定</button>
    </header>

    <!-- Optional Minimal Numeric Telemetry (Toggled from 設定) -->
    <aside id="perf-panel" class="perf-panel hidden" aria-label="計測">
      <div id="perf-grid" class="perf-grid"></div>
    </aside>

    <!-- Consolidated Minimalist Settings Sheet -->
    <aside id="settings-sheet" class="settings-sheet hidden" role="dialog" aria-label="設定">
      <div class="settings-head">
        <span>設定</span>
        <button id="btn-close-settings" class="icon-close-btn" type="button" aria-label="閉じる">✕</button>
      </div>

      <div class="settings-body">
        <div class="setting-row setting-row-col">
          <div class="setting-label-row">
            <span>カメラ感度</span>
            <strong id="sens-val" class="mono-val">1.0×</strong>
          </div>
          <input id="input-sens" class="setting-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
        </div>

        <label class="setting-row setting-toggle">
          <div class="setting-title-col">
            <span>SM1.1S</span>
            <small>SURFACE MODE 1.1 SUPER</small>
          </div>
          <input id="toggle-sm11s" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>嵐</span>
          <input id="toggle-storm" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>ライト</span>
          <input id="toggle-light" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>音声</span>
          <input id="toggle-audio" type="checkbox" checked />
          <span class="switch-track"></span>
        </label>

        <label class="setting-row setting-toggle">
          <span>計測</span>
          <input id="toggle-perf" type="checkbox" />
          <span class="switch-track"></span>
        </label>

        <div class="settings-actions">
          <button id="btn-fullscreen" class="setting-action-btn" type="button">全画面</button>
          <button id="btn-drive-exit-settings" class="setting-action-btn setting-action-danger hidden" type="button">降車</button>
          <button id="btn-install" class="setting-action-btn setting-action-accent hidden" type="button">PWA</button>
        </div>
      </div>
    </aside>

    <!-- Minimal Driving Speedometer ONLY (Bottom-Right Corner; Tap or [E] to Exit Vehicle) -->
    <button id="drive-hud" class="drive-speed-pill hidden" type="button" aria-label="速度">
      <strong id="drive-speed-val">0</strong>
      <span>km/h</span>
    </button>

    <!-- Single Ultra-Minimal Crouch Icon (On-Foot Touch Only, Hidden While Driving) -->
    <div id="mobile-actions" class="mobile-actions">
      <button id="mob-crouch" class="mob-crouch-btn" type="button" aria-label="しゃがむ">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    </div>

    <!-- Edge-to-Edge Fullscreen High-Precision 3D Map, Authentic 2D Route Map & 23-Sheet CAD Blueprint Modal -->
    <section id="map-modal" class="map-modal mode-3d hidden" role="dialog" aria-modal="true" aria-label="地図">
      <!-- Transparent Full-Screen Interactive Gesture Layer for Live 3D Topographic Map -->
      <div id="map3d-gesture-layer" class="map3d-gesture-layer"></div>

      <!-- Full-Screen Authentic 2D Topographic Map & 30-Waypoint Autonomous Route Selector -->
      <div id="terreno-2d-panel" class="terreno-2d-panel hidden"></div>

      <!-- Full-Screen Edge-to-Edge CAD Architectural Blueprint Layer (2-Finger Zoom Out/In & Free Pan) -->
      <div id="cad-map-body" class="cad-fullscreen hidden">
        <div id="blueprint-viewport" class="blueprint-viewport">
          <div id="blueprint-mount" class="blueprint-mount"></div>
        </div>
      </div>

      <!-- Minimal Floating Top-Left 3D Camera Icons (3D Map Mode Only — Zero Text) -->
      <div id="map3d-controls" class="map-float-tl">
        <button id="btn-map3d-focus" class="map-icon-btn" type="button" aria-label="現在地・全景">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4" />
            <circle cx="12" cy="12" r="9" opacity="0.55" />
          </svg>
        </button>
        <button id="btn-map3d-orbit" class="map-icon-btn" type="button" aria-label="回転モード">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>

      <!-- Minimal Floating Top-Right Controls -->
      <div class="map-float-tr">
        <div id="bp-tools-group" class="bp-tools-group hidden">
          <button id="btn-zoom-out" class="map-pill-btn" type="button" aria-label="縮小">−</button>
          <button id="btn-zoom-in" class="map-pill-btn" type="button" aria-label="拡大">＋</button>
          <button id="btn-export-svg" class="map-pill-btn" type="button">SVG</button>
          <button id="btn-export-all-svg" class="map-pill-btn map-pill-accent" type="button">全SVG</button>
          <button id="btn-export-all-zip" class="map-pill-btn" type="button">ZIP</button>
        </div>
        <button id="btn-close-map" class="map-icon-btn map-close-icon" type="button" aria-label="閉じる">✕</button>
      </div>

      <!-- Slim Floating Bottom Floor / 3D / 2D Switcher Pill Bar -->
      <nav id="bp-floor-tabs" class="floor-pill-bar" role="tablist" aria-label="地図切替">
        <button class="floor-tab floor-tab-3d active" data-floor="30" type="button" role="tab">3D</button>
        <button class="floor-tab floor-tab-2d" data-floor="31" type="button" role="tab">2D</button>
        <button class="floor-tab floor-tab-classified" data-floor="0" type="button" role="tab">B4</button>
        <button class="floor-tab floor-tab-deep" data-floor="1" type="button" role="tab">B3</button>
        <button class="floor-tab floor-tab-deep" data-floor="2" type="button" role="tab">B2</button>
        <button class="floor-tab" data-floor="3" type="button" role="tab">B1</button>
        <button class="floor-tab" data-floor="4" type="button" role="tab">1F</button>
        <button class="floor-tab" data-floor="5" type="button" role="tab">2F</button>
        <button class="floor-tab" data-floor="6" type="button" role="tab">3F</button>
        <button class="floor-tab" data-floor="7" type="button" role="tab">4F</button>
        <button class="floor-tab" data-floor="8" type="button" role="tab">5F</button>
        <button class="floor-tab" data-floor="9" type="button" role="tab">6F</button>
        <button class="floor-tab" data-floor="10" type="button" role="tab">RF</button>
        <button class="floor-tab" data-floor="11" type="button" role="tab">隣1</button>
        <button class="floor-tab" data-floor="12" type="button" role="tab">隣2</button>
        <button class="floor-tab" data-floor="13" type="button" role="tab">隣3</button>
        <button class="floor-tab" data-floor="14" type="button" role="tab">隣R</button>
        <button class="floor-tab" data-floor="15" type="button" role="tab">倉1</button>
        <button class="floor-tab" data-floor="16" type="button" role="tab">倉2</button>
        <button class="floor-tab floor-tab-rv" data-floor="17" type="button" role="tab">RV1</button>
        <button class="floor-tab floor-tab-rv" data-floor="18" type="button" role="tab">RV2</button>
        <button class="floor-tab floor-tab-kei" data-floor="19" type="button" role="tab">軽</button>
        <button class="floor-tab floor-tab-garage" data-floor="20" type="button" role="tab">車庫</button>
        <button class="floor-tab floor-tab-armor" data-floor="21" type="button" role="tab">装甲</button>
        <button class="floor-tab floor-tab-cont" data-floor="22" type="button" role="tab">箱</button>
      </nav>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
